[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taca-lab"
version = "0.1.0"
description = "Transition-Aware Credit Assignment in multi-turn agentic RL (CPU-only NumPy reproduction)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
